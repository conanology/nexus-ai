name: CI

on:
  push:
    branches: [ main, master, develop, 'release/**' ]
  pull_request:
    branches: [ '**' ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r --if-present run build

      - name: Lint
        run: pnpm -r --if-present run lint

      - name: Type Check
        run: pnpm -r --if-present run type-check

      - name: Check Types Alias
        run: pnpm -r --if-present run check-types

      - name: Tests
        run: pnpm run test:ci
